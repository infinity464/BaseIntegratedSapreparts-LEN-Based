<section class="content">
    <div class="container-fluid">
      <div class="block-header">
        <div class="row">
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <ul class="breadcrumb breadcrumb-style ">
              <li class="breadcrumb-item">
                <h4 class="page-title">{{pageTitle}}</h4>
              </li>
              <li class="breadcrumb-item bcrumb-1">
                <a routerLink="/admin/dashboard/main">
                  <i class="fas fa-home"></i> </a>
              </li>
              <li class="breadcrumb-item bcrumb-2">
                <a href="#" onClick="return false;">Update Schedule Maintenence</a>
              </li>
              <li class="breadcrumb-item active">{{destination}}</li>
            </ul>
          </div> 
        </div>
      </div>
      <div class="row clearfix">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
          <div class="card">
            <div class="body">
              <form class="m-4" [formGroup]="DenoForm" (ngSubmit)="onSubmit()">
                <div class="row">
                  
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                      <mat-label>Dr No</mat-label>
                      <input matInput type="text" formControlName="drNo"/>
                    </mat-form-field>
                  </div>
                
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                      <mat-label>Start Date</mat-label>
                      <input matInput [matDatepicker]="datepicker" formControlName="startDate">
                      <mat-datepicker-toggle matSuffix [for]="datepicker"></mat-datepicker-toggle>
                      <mat-datepicker #datepicker></mat-datepicker>
                    </mat-form-field>
                  </div>
                  
                  <!-- <td class="cl-mrk-rmrk">
                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                      <mat-select formControlName="progresId">
                        <mat-option  value="">--Select--</mat-option >
                        <mat-option *ngFor="let dropdown of selectedProgress" [value]="dropdown.value">
                          {{dropdown.text}} 
                        </mat-option>                          
                      </mat-select>
                    </mat-form-field>    
                  </td> -->
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                      <mat-label>Completed Date</mat-label>
                      <input matInput [matDatepicker]="datepicker1" formControlName="completedDate">
                      <mat-datepicker-toggle matSuffix [for]="datepicker1"></mat-datepicker-toggle>
                      <mat-datepicker #datepicker1></mat-datepicker>
                    </mat-form-field>
                  </div>
               <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3" appearance="outline">
                    <mat-label>By Whom</mat-label>
                    <mat-select formControlName="byWhomId">
                      <mat-option  value="">--Select--</mat-option >
                      <mat-option *ngFor="let dropdown of selectedbyWhoms" [value]="dropdown.value">
                        {{dropdown.text}} 
                      </mat-option>                          
                    </mat-select>
                  </mat-form-field>    
                </div>

                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3" appearance="outline">
                    <mat-label>Progress</mat-label>
                    <mat-select formControlName="progresId">
                      <mat-option  value="">--Select--</mat-option >
                      <mat-option *ngFor="let dropdown of selectedProgress" [value]="dropdown.value">
                        {{dropdown.text}} 
                      </mat-option>                          
                    </mat-select>
                  </mat-form-field>    
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3" appearance="outline">
                    <mat-label>Fiscal Year</mat-label>
                    <mat-select formControlName="fiscalYearId">
                      <mat-option  value="">--Select--</mat-option >
                      <mat-option *ngFor="let dropdown of selectedFiscalYear" [value]="dropdown.value">
                        {{dropdown.text}} 
                      </mat-option>                          
                    </mat-select>
                  </mat-form-field>    
                </div>
            </div>

                
               
                <div class="row">
                  <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <button class="btn-space" [disabled]="!DenoForm.valid " mat-raised-button
                      color="primary">{{btnText}}</button>
                    <button type="button" mat-button routerLink="/maintenence-planning/add-schedulemaintenence">Cancel</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
