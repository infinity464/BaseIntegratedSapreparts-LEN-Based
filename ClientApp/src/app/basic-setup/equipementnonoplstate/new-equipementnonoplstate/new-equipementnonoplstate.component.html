<section class="content">
    <div class="container-fluid">
      <div class="block-header">
        <div class="row">
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <ul class="breadcrumb breadcrumb-style ">
              <li class="breadcrumb-item">
                <h4 class="page-title">{{pageTitle}}</h4>
              </li>
              <li class="breadcrumb-item bcrumb-1">
                <a routerLink="/admin/dashboard/main">
                  <i class="fas fa-home"></i> </a>
              </li>
              <li class="breadcrumb-item bcrumb-2">
                <a href="#" onClick="return false;">Fiscal Year</a>
              </li>
              <li class="breadcrumb-item active">{{destination}}</li>
            </ul>
          </div> 
        </div>
      </div>
      <div class="row clearfix">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
          <div class="card">
            <div class="body">
              <form class="m-4" [formGroup]="IssueRegisterForm" (ngSubmit)="onSubmit()">
                <div class="row">
                  <!-- <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                      <mat-label>Status</mat-label>
                      <input matInput formControlName="status" required>
                      <mat-error *ngIf="IssueRegisterForm.get('status').hasError('required')">
                        status is required
                      </mat-error>
                    </mat-form-field>
                  </div> -->
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                      <mat-label>Status</mat-label>
                      <mat-select [(value)]="statusValue" formControlName="status"  required="true">
                        <mat-option value="">--Select--</mat-option>
                        <mat-option [value]="1">NON-OPL</mat-option>
                        <mat-option  [value]="0">OPL</mat-option>
                      </mat-select>
                      <mat-error *ngIf="IssueRegisterForm.get('status').hasError('required')">
                        status is Required
                      </mat-error>
                    </mat-form-field>
                  </div>
                  <div *ngIf="statusValue == 1" class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                      <mat-label>Reason</mat-label>
                      <input matInput formControlName="reason" required="true">
                      <mat-error *ngIf="IssueRegisterForm.get('reason').hasError('required')">
                        reason is required
                      </mat-error>
                    </mat-form-field>
                  </div>
                </div>
               
                <div class="row">
                  <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <button class="btn-space" [disabled]="!IssueRegisterForm.valid " mat-raised-button
                      color="primary">{{btnText}}</button>
                    <button type="button" mat-button routerLink="/basic-setup/equipementnonoplstate-list">Cancel</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
